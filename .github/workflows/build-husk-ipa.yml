# 在 GitHub 的 macOS 机器上从源码构建 Husk（iPhone 上跑 Android 的开源项目），
# 产出 Husk.ipa（adhoc 签名 = 实际意义上的未签名包），下载后用自己的个人证书重签安装。
#
# 引擎是开源项目 Husk（GPL-2.0-or-later）：https://github.com/Leviidev/Husk
# 本 workflow 只是它的云端构建流水线，不包含引擎源码；构建时按下面锁定的
# commit 拉取官方源码，再运行官方构建脚本 scripts/ci_build.sh。
#
# 用法：把本仓库推到 GitHub → Actions 页 → Build Husk IPA → Run workflow。
# 首次构建要现编译 QEMU / ANGLE / glib / MoltenVK 等全部依赖，耗时较长
# （实测前请按 1–3 小时预留，GitHub 公共仓库单 job 上限 360 分钟）。

name: Build Husk IPA

on:
  workflow_dispatch:
    inputs:
      husk_ref:
        description: "Husk 源码 commit / tag（留空用下面锁定的版本）"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/build-husk-ipa.yml"

# 同一时间只跑一个构建，重复触发时取消旧的，省额度
concurrency:
  group: build-husk-ipa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Husk.ipa
    runs-on: macos-26
    timeout-minutes: 350

    env:
      # 2026-11-03 的 Husk 主线 HEAD，在这个版本上核对过构建脚本与工程结构
      HUSK_PINNED_COMMIT: d92d0a112a391833584ac61f21296e566e404cb8

    steps:
      - name: Checkout this build repo
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Install build tools (Homebrew)
        run: |
          brew update
          brew install meson ninja pkg-config xcodegen qemu
          # virglrenderer 的 meson 构建需要 PyYAML，而 runner 的 Homebrew
          # python3 里没有它（第 3 次构建就死在这里）；作者本机有所以没暴露。
          /opt/homebrew/bin/python3 -m pip install --break-system-packages pyyaml
          /opt/homebrew/bin/python3 -c "import yaml; print('pyyaml ok')"
          # qemu-img 由 qemu 这个 formula 提供，Husk 官方构建依赖清单里有它
          which qemu-img meson ninja pkg-config xcodegen

      - name: Install Rust target for iOS
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Cache downloaded dependency sources
        uses: actions/cache@v4
        with:
          path: husk/third_party/sources
          key: husk-dep-sources-${{ env.HUSK_PINNED_COMMIT }}
          restore-keys: |
            husk-dep-sources-

      - name: Clone Husk at pinned commit
        run: |
          REF="${{ inputs.husk_ref }}"
          if [ -z "$REF" ]; then REF="$HUSK_PINNED_COMMIT"; fi
          echo "Building Husk ref: $REF"
          git clone https://github.com/Leviidev/Husk.git husk
          cd husk
          git checkout "$REF"
          git log -1 --format='%H %ci %s'

      - name: Patch ANGLE thread-safety build issue
        run: |
          # 上游 WebKit 的 ANGLE SimpleMutex.h 给 std::mutex 加了
          # ACQUIRE/RELEASE_CAPABILITY 注解，Xcode 26 的 clang 在
          # -Wthread-safety-* 下把它当作 -Werror，导致第 1、2 次构建都死
          # 在 ANGLE 这一步。注解只是静态分析提示，去掉它不改变生成代码；
          # 同时把这两个警告降级为警告，双保险。
          cd husk
          git apply --check ../patches/angle-thread-safety.patch
          git apply ../patches/angle-thread-safety.patch
          git diff --stat

      - name: Patch StikJIT Swift interface for Xcode 26 (Swift 6.2)
        run: |
          # Husk 自带的 StikJIT.xcframework 里的 .swiftinterface 是用 Swift 6.4
          # 生成的，类型用 :: 限定（如 Swift::String），Xcode 26.3 自带的
          # Swift 6.2 解析不了，app 构建一步就死在这里（第 4 次构建的报错）。
          # 把 :: 换回 6.2 识别的 . 形式，并去掉 6.2 不认识的实验特性开关；
          # 只改接口文本，不改二进制库。
          cd husk/src/app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/Modules/StikJIT.swiftmodule
          sed -i '' 's/::/./g' arm64-apple-ios.swiftinterface arm64-apple-ios.private.swiftinterface
          sed -i '' 's/ -enable-experimental-feature DebugDescriptionMacro//g' arm64-apple-ios.swiftinterface arm64-apple-ios.private.swiftinterface
          echo "remaining :: occurrences (expect 0 0):"
          grep -c '::' arm64-apple-ios.swiftinterface arm64-apple-ios.private.swiftinterface || true

      - name: Build everything and package the IPA
        working-directory: husk
        run: |
          set -o pipefail
          # 官方一键构建：拉依赖源码 → 编译 libffi/glib/pixman/libslirp →
          # ANGLE → virglrenderer → QEMU → 集成本体源码重编 QEMU →
          # 拉 guest 内核/固件 → MoltenVK → Rust 配对组件 → 打包 IPA
          ./scripts/ci_build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ci_build.log"
          ls -lh build/

      - name: Verify IPA structure
        run: |
          test -f husk/build/Husk.ipa
          unzip -l husk/build/Husk.ipa | head -30
          # IPA 里必须有 Payload/Husk.app 本体
          unzip -l husk/build/Husk.ipa | grep -q "Payload/Husk.app/Husk" \
            || { echo "IPA 结构不对，缺 Payload/Husk.app/Husk"; exit 1; }
          echo "IPA OK: $(du -h husk/build/Husk.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa-unsigned
          path: |
            husk/build/Husk.ipa
            husk/build/Husk.tipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ci_build.log
          if-no-files-found: ignore
          retention-days: 30
